user nginx;
worker_processes auto;
# 建议：错误日志路径与 Docker 映射保持一致
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式：增加了 $request_time 方便你做性能审计
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$request_time"s';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip 压缩：在校园网等弱网环境下提升前端加载速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    server {
        listen 80;
        server_name localhost; # 生产环境可改为你的域名

        # 对应 docker-compose 中 frontend/dist 的挂载点
        root /var/www/bluebell;
        index index.html index.htm;

        # 1. 前端路由：支持 SPA (Vue/React) 的 History 模式
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 2. 后端接口转发：统一管理所有 API 和 登录注册
        # 利用正则匹配合并之前的重复配置，更清晰、更安全
        location ~ ^/(v1|login|register|swagger) {
            proxy_pass http://backend:8080;

            # 基础 Header 转发
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 优化：支持 WebSocket 和 长连接（Go 后端常用）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置：防止数据库大查询导致连接中断
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # 3. 静态资源缓存加速
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off; # 静态资源不记录访问日志，减少 IO
        }

        # 4. 安全配置：禁止访问隐藏文件 (如 .git)
        location ~ /\. {
            deny all;
        }
    }
}
